name: rename-app-to-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename app.html to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv app.html index.html
          ls -lh index.html
          git status --short
          git commit -m "Rename app.html to index.html via workflow"
          git push
